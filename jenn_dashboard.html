<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jenn's Command Centre</title>
<style>
  :root {
    --bg: #0f0f0f; --bg2: #1a1a1a; --border: #2a2a2a; --border2: #333;
    --text: #e8e8e8; --text2: #999; --text3: #555;
    --red: #ff4444; --red-bg: rgba(255,68,68,0.08); --red-border: rgba(255,68,68,0.25);
    --orange: #ff8c00; --blue: #4a9eff; --green: #22c55e;
    --green-bg: rgba(34,197,94,0.1); --green-border: rgba(34,197,94,0.4);
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }
  .header { padding: 1.25rem 1.5rem 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .header-left h1 { font-size: 15px; font-weight: 600; }
  .header-left .date { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .clock { font-size: 13px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 6px; }
  .stat { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 10px; text-align: center; }
  .stat-n { font-size: 16px; font-weight: 600; line-height: 1.2; }
  .stat-l { font-size: 10px; color: var(--text2); }
  .pbar-wrap { height: 2px; background: var(--border2); }
  .pbar-fill { height: 100%; background: var(--green); transition: width 0.3s; }
  .sync-bar { font-size: 10px; color: var(--text3); text-align: right; padding: 3px 1.5rem; }
  .content { padding: 1rem 1.5rem 3rem; max-width: 780px; }
  .sec { margin-bottom: 1.5rem; }
  .sec-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 0.4rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .fdl-box { border: 1px solid var(--red-border); border-radius: var(--radius); padding: 0.75rem 1rem; margin-bottom: 1.5rem; background: var(--red-bg); }
  .fdl-box .sec-label { color: var(--red); border-bottom-color: var(--red-border); margin-bottom: 0.5rem; }
  .fdl-status { font-size: 10px; color: var(--red); opacity: 0.7; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; transition: opacity 0.2s; }
  .fdl-box .item { border-bottom-color: rgba(255,68,68,0.1); }
  .item:last-child { border-bottom: none; }
  .item.done { opacity: 0.3; }
  .item.done .itxt { text-decoration: line-through; color: var(--text2); }
  .checkbox { flex-shrink: 0; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border2); margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .item.done .checkbox { background: var(--green-bg); border-color: var(--green-border); }
  .checkmark { display: none; color: var(--green); font-size: 11px; }
  .item.done .checkmark { display: block; }
  .itxt { flex: 1; color: var(--text); }
  .imeta { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .bdg { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; margin-top: 2px; white-space: nowrap; }
  .b-red { background: rgba(255,68,68,0.15); color: var(--red); }
  .b-orange { background: rgba(255,140,0,0.15); color: var(--orange); }
  .b-blue { background: rgba(74,158,255,0.15); color: var(--blue); }
  .loading { font-size: 12px; color: var(--text3); padding: 8px 0; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Command Centre</h1>
    <div class="date" id="datestr"></div>
  </div>
  <div class="header-right">
    <div class="stats">
      <div class="stat"><div class="stat-n" id="dn">0</div><div class="stat-l">done</div></div>
      <div class="stat"><div class="stat-n" id="rn">0</div><div class="stat-l">left</div></div>
    </div>
    <div class="clock"
